name: Release

on:
  push:
    tags: ['v0.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & publish pre-release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $group = $props.Project.PropertyGroup | Select-Object -First 1
          $version = if ($group.VersionSuffix) { "$($group.VersionPrefix)-$($group.VersionSuffix)" } else { $group.VersionPrefix }
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match project version v$version" }
          if (-not $version.StartsWith('0.')) { throw 'Releases must stay on 0.x until the first stable version.' }

      - name: Build, test and package
        shell: pwsh
        run: ./build/publish.ps1

      - name: Create GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = @(Get-ChildItem artifacts -Filter *.zip | ForEach-Object FullName)
          if ($zips.Count -ne 2) { throw "Expected installer and portable zips, found $($zips.Count)" }
          gh release create "${{ github.ref_name }}" @zips --prerelease --title "Couchtop ${{ github.ref_name }}" --notes-file .github/RELEASE_NOTES.md
